<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>教本 用語索引｜京都ハング ライブラリ</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/site-header.js" defer></script>
<style id="access-guard-style">
#access-guard{
  position:fixed;inset:0;z-index:99999;
  display:flex;align-items:center;justify-content:center;
  padding:24px;background:#f5f8fa;
}
#access-guard[hidden]{display:none}
#access-card{
  width:min(100%,420px);background:#fff;border:1px solid #dce6eb;
  border-radius:22px;padding:24px;box-shadow:0 14px 40px rgba(20,50,70,.12)
}
#access-card h1{margin:0 0 8px;font-size:24px;color:#173747}
#access-card p{margin:0 0 16px;color:#71838d;font-size:14px}
#access-pass{
  width:100%;font-size:18px;padding:12px 14px;border:1px solid #cfdbe1;
  border-radius:12px;outline:none
}
#access-pass:focus{border-color:#4b8ea9}
#access-submit{
  width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:12px;
  background:#173747;color:#fff;font-size:16px;font-weight:700
}
#access-error{min-height:1.3em;margin-top:10px;color:#b33;font-size:13px}
</style>
<style>
.index-intro{font-size:14px;color:var(--muted);margin:0 0 17px;line-height:1.8}
.index-controls{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff;display:grid;gap:12px}
.index-search-wrap{display:flex;align-items:center;border:1px solid #cbdad8;border-radius:12px;background:#fff;gap:8px;padding:0 12px}
.index-search-wrap:focus-within{border-color:var(--ink);box-shadow:0 0 0 2px #245b6215}
.index-search-icon{font-size:20px;color:var(--muted);flex:none}
.index-search{width:100%;min-width:0;font:inherit;font-size:16px;border:none;outline:none;padding:12px 0;background:transparent;color:var(--text)}
.index-clear{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:5px}
.index-clear[hidden]{display:none}
.index-label{font-size:12px;font-weight:700;color:var(--muted)}
.index-category{width:100%;padding:10px 12px;font:inherit;font-size:14px;color:var(--text);border:1px solid var(--line);border-radius:12px;background:#fff}
.index-summary{margin:15px 0 10px;color:var(--muted);font-size:13px}
.index-group{margin:15px 0 23px}
.index-group-title{font-size:17px!important;color:var(--ink);margin:0 0 8px!important;padding-bottom:8px;border-bottom:2px solid var(--line)}
.index-list{display:grid;gap:8px}
.index-entry{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px}
.index-entry-name{font-size:16px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;margin:0}
.index-reading{font-size:12px;color:var(--muted);margin:2px 0 8px;overflow-wrap:anywhere}
.index-page-row{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.index-page-label{color:var(--muted);font-size:12px}
.index-page{display:inline-block;border-radius:8px;padding:3px 7px;background:var(--info-surface);font-size:12px;font-variant-numeric:tabular-nums}
.index-category-name{font-size:12px;color:var(--muted);margin-top:8px}
.index-empty{padding:30px 15px;text-align:center;color:var(--muted);font-size:14px}
.index-caption{font-size:12px;color:var(--muted);line-height:1.7;margin:16px 0}
@media(min-width:680px){.index-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="access-guard" aria-modal="true" role="dialog">
  <div id="access-card">
    <h1>京都ハング ライブラリ</h1>
    <p>共通パスコードを入力してください。</p>
    <form id="access-form">
      <input id="access-pass" type="password" inputmode="numeric" autocomplete="off" aria-label="パスコード">
      <button id="access-submit" type="submit">入る</button>
      <div id="access-error" aria-live="polite"></div>
    </form>
  </div>
</div>


<div class="site">
<header class="header" id="site-header"></header>
<section class="hero">
  <h1>教本 用語索引</h1>
  <p>用語や読み仮名から、教本の掲載ページを探す</p>
</section>
<main class="main">
<section class="section">
  <p class="index-intro">漢字・カタカナ・ひらがなで検索できます。用語の一部分だけでも検索可能です。検索しないときは分野別に表示します。</p>
  <div class="index-controls">
    <label class="index-label" for="term-search">用語・読み仮名で検索</label>
    <div class="index-search-wrap">
      <span class="index-search-icon" aria-hidden="true">⌕</span>
      <input class="index-search" id="term-search" type="search" placeholder="例：迎え角、あたっく、さーまる" autocomplete="off" spellcheck="false">
      <button id="search-clear" class="index-clear" type="button" aria-label="検索をクリア" hidden>×</button>
    </div>
    <label class="index-label" for="category-select">分野</label>
    <select id="category-select" class="index-category"><option value="">すべての分野</option></select>
  </div>
  <p class="index-summary" id="result-summary" role="status" aria-live="polite"></p>
  <div id="result-list"></div>
  <p class="index-caption">教本の掲載ページを示す索引です。本文の解説ではありません。ページ番号はスプレッドシートに記録された値を使用しています。</p>
</section>
</main>
<footer class="footer">京都ハング ライブラリ</footer>
</div>

<script>
(function(){
"use strict";
const data=JSON.parse(document.getElementById("index-data").textContent);
const search=document.getElementById("term-search");
const select=document.getElementById("category-select");
const clear=document.getElementById("search-clear");
const list=document.getElementById("result-list");
const summary=document.getElementById("result-summary");
const categories=[...new Set(data.map(item=>item.category))];
categories.forEach(cat=>{const option=document.createElement("option");option.value=cat;option.textContent=cat;select.appendChild(option)});
function normalize(value){
 return String(value).normalize("NFKC").toLowerCase()
 .replace(/[\u30a1-\u30f6]/g,character=>String.fromCharCode(character.charCodeAt(0)-96))
 .replace(/[\s　（）()・\-ー]/g,"");
}
function make(tag,className,text){
 const el=document.createElement(tag);
 if(className)el.className=className;
 if(text!==undefined)el.textContent=text;
 return el;
}
function createEntry(item,includeCategory){
 const card=make("article","index-entry");
 card.appendChild(make("h3","index-entry-name",item.term));
 card.appendChild(make("p","index-reading",item.reading));
 const row=make("div","index-page-row");
 row.appendChild(make("span","index-page-label","教本"));
 for(const [key,label] of [["ab","A/B"],["np","NP"],["p","P"]]){
   if(!item[key])continue;
   row.appendChild(make("span","index-page",label+"：p."+item[key]));
 }
 card.appendChild(row);
 if(includeCategory)card.appendChild(make("div","index-category-name",item.category));
 return card;
}
function render(){
 const q=normalize(search.value);
 const cat=select.value;
 clear.hidden=!search.value;
 const filtered=data.filter(item=>(!cat||item.category===cat)&&(!q||normalize(item.term+item.reading).includes(q)));
 summary.textContent=filtered.length+"件／全"+data.length+"項目";
 list.replaceChildren();
 if(!filtered.length){list.appendChild(make("p","index-empty","一致する用語がありません。"));return;}
 if(q){
   const result=make("div","index-list");
   filtered.forEach(item=>result.appendChild(createEntry(item,true)));
   list.appendChild(result);
 }else{
   const visible=cat?[cat]:categories;
   visible.forEach(group=>{
     const groupData=filtered.filter(item=>item.category===group);
     if(!groupData.length)return;
     const section=make("section","index-group");
     section.appendChild(make("h2","index-group-title",group+"（"+groupData.length+"）"));
     const entries=make("div","index-list");
     groupData.forEach(item=>entries.appendChild(createEntry(item,false)));
     section.appendChild(entries);
     list.appendChild(section);
   });
 }
}
search.addEventListener("input",render);
select.addEventListener("change",render);
clear.addEventListener("click",()=>{search.value="";search.focus();render()});
render();
})();
</script>
<script id="access-guard-script">
(function(){
  const KEY="kyotoHangAccess";
  const PASS="440";
  const guard=document.getElementById("access-guard");
  const form=document.getElementById("access-form");
  const input=document.getElementById("access-pass");
  const error=document.getElementById("access-error");
  if(sessionStorage.getItem(KEY)==="ok"){
    guard.hidden=true;
    return;
  }
  setTimeout(()=>input.focus(),50);
  form.addEventListener("submit",function(e){
    e.preventDefault();
    if(input.value===PASS){
      sessionStorage.setItem(KEY,"ok");
      guard.hidden=true;
      error.textContent="";
      window.scrollTo(0,0);
    }else{
      error.textContent="パスコードが違います。";
      input.value="";
      input.focus();
    }
  });
})();
</script>
