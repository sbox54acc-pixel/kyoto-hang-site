<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>印刷用・教本用語索引（五十音順）｜京都ハング</title>
<link rel="stylesheet" href="../assets/style.css">
<style id="access-guard-style">
#access-guard{
  position:fixed;inset:0;z-index:99999;
  display:flex;align-items:center;justify-content:center;
  padding:24px;background:#f5f8fa;
}
#access-guard[hidden]{display:none}
#access-card{
  width:min(100%,420px);background:#fff;border:1px solid #dce6eb;
  border-radius:22px;padding:24px;box-shadow:0 14px 40px rgba(20,50,70,.12)
}
#access-card h1{margin:0 0 8px;font-size:24px;color:#173747}
#access-card p{margin:0 0 16px;color:#71838d;font-size:14px}
#access-pass{
  width:100%;font-size:18px;padding:12px 14px;border:1px solid #cfdbe1;
  border-radius:12px;outline:none
}
#access-pass:focus{border-color:#4b8ea9}
#access-submit{
  width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:12px;
  background:#173747;color:#fff;font-size:16px;font-weight:700
}
#access-error{min-height:1.3em;margin-top:10px;color:#b33;font-size:13px}
</style>
<style>
.print-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 18px 0}
.print-tools button{background:var(--ink);color:white;border:0;border-radius:9px;padding:10px 20px;font-size:15px;font-weight:700;cursor:pointer}
.print-tools a{font-size:13px;text-decoration:underline;color:var(--ink)}
.paper{padding:24px 28px 32px;background:white}
.paper-header{border-bottom:2px solid var(--ink);padding-bottom:11px;margin-bottom:17px}
.paper-header h1{font-size:20px;margin:0;color:var(--ink)}
.paper-header p{font-size:11px;color:var(--muted);margin:4px 0 0}
.entry-columns{columns:2;column-gap:25px;column-rule:1px solid #d9dfdf}
.entry{display:flex;align-items:baseline;gap:6px;break-inside:avoid;page-break-inside:avoid;border-bottom:1px dotted #ccd6d5;padding:4px 0 5px;font-size:12px;line-height:1.5}
.entry-name{font-weight:500;overflow-wrap:anywhere;flex:1;min-width:0}
.entry-pages{flex:none;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.paper-footer{font-size:10px;margin:15px 0 0;color:#647477}
.loading{padding:36px 0;color:var(--muted)}
@media(max-width:570px){.paper{padding:18px 15px}.entry-columns{columns:1}}
@page{size:A4 portrait;margin:12mm 13mm}
@media print{
 html,body{background:white!important;color:#111!important}
 .site{max-width:none!important;min-height:0!important;background:white!important}
 .print-tools,#access-guard{display:none!important}
 .paper{padding:0!important}
 .paper-header{margin-bottom:10px;border-color:#444}
 .paper-header h1{font-size:16pt;color:black}
 .paper-header p,.paper-footer{color:#444}
 .entry-columns{columns:2!important;column-gap:8mm;column-rule:1px solid #ddd}
 .entry{font-size:9.2pt;padding:2.4pt 0 3pt;border-color:#c6c6c6}
 .entry-pages{font-size:8.6pt}
}
</style>
</head>
<body>
<div id="access-guard" aria-modal="true" role="dialog">
  <div id="access-card">
    <h1>京都ハング ライブラリ</h1>
    <p>共通パスコードを入力してください。</p>
    <form id="access-form">
      <input id="access-pass" type="password" inputmode="numeric" autocomplete="off" aria-label="パスコード">
      <button id="access-submit" type="submit">入る</button>
      <div id="access-error" aria-live="polite"></div>
    </form>
  </div>
</div>



<div class="site">
<div class="print-tools"><button type="button" id="print-button">印刷・PDF保存</button><a href="textbook-index.html">検索ページへ戻る</a></div>
<main class="paper">
<header class="paper-header"><h1>ハンググライダー教本　用語索引</h1><p>五十音順 ／ 見出しと掲載ページのみ</p></header>
<div id="entries" class="entry-columns"><p class="loading">索引を読み込んでいます…</p></div>
<p class="paper-footer" id="count-note"></p>
</main>
</div>
<script>
(async function(){
 "use strict";
 const container=document.getElementById("entries");
 const splitReadings={
  "ねじり下げ（ウォッシュアウト）":[["ねじり下げ","ねじりさげ"],["ウォッシュアウト","うぉっしゅあうと"]],
  "セットアップ・ブレイクダウン":[["セットアップ","せっとあっぷ"],["ブレイクダウン","ぶれいくだうん"]],
  "寝ハーネス（プローンハーネス）":[["寝ハーネス","ねはーねす"],["プローンハーネス","ぷろーんはーねす"]],
  "アタックアングル（迎え角）":[["アタックアングル","あたっくあんぐる"],["迎え角","むかえかく"]],
  "ターン（旋回）":[["ターン","たーん"],["旋回","せんかい"]],
  "サブ（セカンダリー）":[["サブ","さぶ"],["セカンダリー","せかんだりー"]],
  "場周（ボックス）":[["場周","じょうしゅう"],["ボックス","ぼっくす"]],
  "吹き抜け（収束帯）":[["吹き抜け","ふきぬけ"],["収束帯","しゅうそくたい"]]
 };
 const canon=x=>String(x).normalize("NFKC").toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
 const collator=new Intl.Collator("ja",{sensitivity:"base",numeric:true});
 try{
  const response=await fetch("textbook-index.html",{cache:"no-store"});
  if(!response.ok)throw new Error("元データの取得に失敗しました");
  const documentData=new DOMParser().parseFromString(await response.text(),"text/html");
  const payload=documentData.getElementById("index-data");
  if(!payload)throw new Error("用語集データが見つかりません");
  const terms=JSON.parse(payload.textContent);
  const expanded=[];
  for(const term of terms){
   const pages=[term.ab,term.np,term.p].filter(Boolean).join("、").split("、").map(s=>Number(s)).filter(Number.isFinite);
   const pageStr=[...new Set(pages)].sort((a,b)=>a-b).join("、");
   const names=splitReadings[term.term]||[[term.term,term.reading]];
   for(const [name,reading] of names)expanded.push({name,reading, pages:pageStr});
  }
  expanded.sort((a,b)=>collator.compare(canon(a.reading),canon(b.reading))||collator.compare(a.name,b.name));
  container.replaceChildren();
  for(const entry of expanded){
   const row=document.createElement("div");row.className="entry";
   const name=document.createElement("span");name.className="entry-name";name.textContent=entry.name;
   const pages=document.createElement("span");pages.className="entry-pages";pages.textContent="p."+entry.pages;
   row.append(name,pages);container.appendChild(row);
  }
  document.getElementById("count-note").textContent=terms.length+"項目から作成 ／ 索引見出し "+expanded.length+"件";
 }catch(error){container.textContent="索引を表示できませんでした。インターネット接続を確認して、再読み込みしてください。";}
})();
document.getElementById("print-button").addEventListener("click",()=>window.print());
</script>
<script id="access-guard-script">
(function(){
  const KEY="kyotoHangAccess";
  const PASS="440";
  const guard=document.getElementById("access-guard");
  const form=document.getElementById("access-form");
  const input=document.getElementById("access-pass");
  const error=document.getElementById("access-error");
  if(sessionStorage.getItem(KEY)==="ok"){
    guard.hidden=true;
    return;
  }
  setTimeout(()=>input.focus(),50);
  form.addEventListener("submit",function(e){
    e.preventDefault();
    if(input.value===PASS){
      sessionStorage.setItem(KEY,"ok");
      guard.hidden=true;
      error.textContent="";
      window.scrollTo(0,0);
    }else{
      error.textContent="パスコードが違います。";
      input.value="";
      input.focus();
    }
  });
})();
</script>
</body>
</html>
