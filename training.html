<link rel="stylesheet" href="style.css">

<style id="access-guard-style">
#access-guard{
  position:fixed;inset:0;z-index:99999;
  display:flex;align-items:center;justify-content:center;
  padding:24px;background:#f5f8fa;
}
#access-guard[hidden]{display:none}
#access-card{
  width:min(100%,420px);background:#fff;border:1px solid #dce6eb;
  border-radius:22px;padding:24px;box-shadow:0 14px 40px rgba(20,50,70,.12)
}
#access-card h1{margin:0 0 8px;font-size:24px;color:#173747}
#access-card p{margin:0 0 16px;color:#71838d;font-size:14px}
#access-pass{
  width:100%;font-size:18px;padding:12px 14px;border:1px solid #cfdbe1;
  border-radius:12px;outline:none
}
#access-pass:focus{border-color:#4b8ea9}
#access-submit{
  width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:12px;
  background:#173747;color:#fff;font-size:16px;font-weight:700
}
#access-error{min-height:1.3em;margin-top:10px;color:#b33;font-size:13px}
</style>

<style>
.training-menu{display:grid;gap:12px}
.training-primary{display:grid;gap:12px}
.training-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}
.training-card strong{font-size:17px;color:var(--ink)}
.training-card.main{padding:22px 18px;background:#fff}
.training-card.main strong{font-size:19px}
.training-arrow{font-size:25px;color:var(--muted);line-height:1}
.training-sub{margin-top:6px}
.reference-box{margin-top:6px;padding:14px 16px;border-radius:16px;background:var(--info-surface);border:0}
.reference-title{margin:0 0 10px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.reference-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.reference-row+.reference-row{border-top:1px solid var(--line)}
.reference-row strong{font-size:15px}
.book-tag{flex:none;padding:5px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.practice-video-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 12px;border-radius:999px;background:#fff;color:var(--main);font-size:12px;font-weight:700;text-decoration:none;border:1px solid var(--line)}
</style>
</head>
<body>

<script id="access-guard-script">
(function(){
  const KEY="kyotoHangAccess";
  const PASS="440";
  const guard=document.getElementById("access-guard");
  const form=document.getElementById("access-form");
  const input=document.getElementById("access-pass");
  const error=document.getElementById("access-error");
  if(sessionStorage.getItem(KEY)==="ok"){
    guard.hidden=true;
    return;
  }
  setTimeout(()=>input.focus(),50);
  form.addEventListener("submit",function(e){
    e.preventDefault();
    if(input.value===PASS){
      sessionStorage.setItem(KEY,"ok");
      guard.hidden=true;
      error.textContent="";
      window.scrollTo(0,0);
    }else{
      error.textContent="パスコードが違います。";
      input.value="";
      input.focus();
    }
  });
})();
</script>

</body>
